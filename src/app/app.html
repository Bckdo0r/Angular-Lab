<!-- Barra superior: navegación principal con selector de tema -->
<header class="barra">
  <a routerLink="/" class="marca" aria-label="Angular Lab — ir al inicio">
    <img ngSrc="logo-angularlab.png" alt="Logo Angular Lab" width="142" height="160" priority />
    <span class="marca-texto" aria-hidden="true">
      <span class="marca-angular">Angular</span><span class="marca-lab">Lab</span>
    </span>
  </a>

  <nav class="nav" aria-label="Navegación principal">
    <a routerLink="/tutorial" routerLinkActive="activa"
      ><icono-svg nombre="libro" [tamano]="17" /> Tutorial</a
    >
    <a routerLink="/extras" routerLinkActive="activa"
      ><icono-svg nombre="frasco" [tamano]="17" /> Prácticas</a
    >
  </nav>

  <!-- Copia el comando de restauración del ejercicio visible. -->
  @if (claveEjercicio(); as clave) {
    @defer {
      <reinicio-boton [claves]="[clave]" etiqueta="Copiar comando" />
    }
  }

  <button
    type="button"
    class="tema"
    (click)="tema.alternar()"
    [attr.aria-pressed]="tema.oscuro()"
    [title]="tema.oscuro() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  >
    <span aria-hidden="true"
      ><icono-svg [nombre]="tema.oscuro() ? 'sol' : 'luna'" [tamano]="16"
    /></span>
    <span class="tema-texto">{{ tema.oscuro() ? 'Claro' : 'Oscuro' }}</span>
  </button>
</header>

<!-- Acá se renderiza cada lección según la ruta -->
<router-outlet />

<!-- Pie de página común a todas las vistas: marca de copyright -->
<footer class="pie">
  <p>© {{ anio }} Angular Lab · Creado por Bckdo0r</p>
</footer>
