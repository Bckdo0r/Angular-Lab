<h2 mat-dialog-title>Datos del insumo</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder='Tornillo autoperforante 8x1"' />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Categoría</mat-label>
      <input
        matInput
        formControlName="categoria"
        placeholder="Ferretería / Electricidad / Pintura"
      />
    </mat-form-field>

    <div class="fila">
      <mat-form-field>
        <mat-label>Stock</mat-label>
        <input matInput type="number" formControlName="stock" min="0" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="precio" min="0" step="0.01" />
      </mat-form-field>
    </div>

    <!-- TODO: [Paso 6] - Errores con MatError (el reemplazo Material del
         .error con getError() de la 02): dentro de cada mat-form-field que
         tenga validaciones, agregá un bloque condicional como este:
           @if (form.controls.nombre.invalid && (form.controls.nombre.touched || form.controls.nombre.dirty)) {
             <mat-error>El nombre es obligatorio (mínimo 3 caracteres).</mat-error>
           }
         Y para el precio, mostrá el error del ValidatorFn propio:
           @if (form.controls.precio.hasError('precioPositivo')) {
             <mat-error>El precio debe ser mayor que 0.</mat-error>
           }
         OJO: el @if NO reemplaza al mat-error: el <mat-error> vive SIEMPRE
         dentro del mat-form-field (reserva su lugar) y el @if solo decide si
         se muestra. Fijate que confirmar() ya llama a markAllAsTouched()
         cuando el form es inválido: eso "toca" todos los campos y hace
         visibles estos errores al mismo tiempo. -->
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton (click)="cancelar()">Cancelar</button>
  <button matButton="filled" (click)="confirmar()">Guardar</button>
</mat-dialog-actions>
